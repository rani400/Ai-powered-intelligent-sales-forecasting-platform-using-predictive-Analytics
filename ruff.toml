# Ruff configuration for SalesGenie AI.
# Run with:  ruff check .        ruff format --check .

line-length = 100
target-version = "py313"
src = ["backend", "frontend"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E731",  # lambda assignment: used deliberately for compact Streamlit callbacks
]

[lint.per-file-ignores]
# FastAPI's dependency injection requires `Depends(...)` in argument defaults.
"backend/app/routers/*.py" = ["B008"]
# SQLAlchemy models use TYPE_CHECKING forward references, so the quotes in
# `Mapped["Lead"]` are required for runtime resolution.
"backend/app/models/*.py" = ["UP037"]
# Tests intentionally build payloads inline and assert on them elsewhere.
"backend/tests/*.py" = ["B011"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
